<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clearweb</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header id="chrome"><div class="tabstrip"><div id="tabs"></div><button id="new-tab" class="icon">＋</button><div class="brand"><span class="brandmark">C</span> Clearweb <span class="ai-pill">AI ON</span></div></div>
<div class="toolbar"><button id="back" class="icon">‹</button><button id="forward" class="icon">›</button><button id="reload" class="icon">↻</button><button id="home" class="icon">⌂</button>
<form id="nav"><span class="shield">◇</span><input id="url" autocomplete="off" spellcheck="false" placeholder="Search privately or type a URL"><button id="bookmark" type="button" title="Bookmark">☆</button><span class="protected">Protected</span></form>
<button id="clean" class="tool active" title="Clean Web">◌</button><button id="protection" class="tool" title="Protection">◇</button><button id="assistant" class="tool spark" title="AI Assistant">✦</button><button id="library" class="tool" title="Library">•••</button></div></header>
<main id="newtab" class="newtab"><div class="hero"><div class="logo">C</div><h1>Browse a clearer web.</h1><p>Private by design. Clean by default. AI stays local.</p><form id="hero-search" class="hero-search"><span>⌕</span><input id="hero-input" placeholder="Search the web"><kbd>⌘ L</kbd></form><div class="feature-row"><div><b>◇ Protected</b><span>Ads & trackers blocked</span></div><div><b>◌ Clean Web</b><span>Clutter removed</span></div><div><b>✦ Qwen Local</b><span>Private AI assistant</span></div></div></div></main>
<div id="scrim" class="scrim hidden"></div><aside id="panel" class="panel hidden"><div class="panel-head"><div><small id="panel-kicker"></small><h2 id="panel-title"></h2></div><button id="panel-close">×</button></div><div id="panel-body"></div></aside>
<script src="renderer.js"></script></body></html>
